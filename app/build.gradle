plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.liapv.myapplication'
    compileSdk 36

    defaultConfig {
        applicationId "com.liapv.myapplication"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    //sirve para formatos json
    implementation 'com.airbnb.android:lottie:3.0.1'
    //sirve para el analisis de la base de datos
    implementation'com.google.firebase:firebase-analytics:21.3.0'
    //libreria sirve para autentificar la base de datos
    implementation'com.google.firebase:firebase-auth:22.1.2'
    //libreria que administra la base de datos
    implementation'com.google.firebase:firebase-database:20.2.2'

    //dependencia 02/09/2025
    implementation 'com.firebaseui:firebase-ui-database:8.0.0'

    //dependencias nilda
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //pdf y excel
    //implementation 'org.apache.poi:poi:5.2.3:android'
    //implementation 'org.apache.poi:poi-ooxml:5.2.3:android'


    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core


    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

}